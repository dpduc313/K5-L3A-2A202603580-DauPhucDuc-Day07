<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt benchmark nâng cao</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f5d8a; --ok: #2e7d4f; --ok-bg: #e6f3eb; --fix: #b4532a; --fix-bg: #fbece4;
  --mark: #fff0a8; --chip: #efede8; --code: #f3f2ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #201f1d; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
    --accent: #7fb0e0; --ok: #6fcf97; --ok-bg: #1d3326; --fix: #f0a07a; --fix-bg: #3a2519;
    --mark: #5c5113; --chip: #2c2b28; --code: #262522;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
select, button, textarea { font: inherit; color: inherit; }
select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.progress { color: var(--muted); font-size: 14px; }
.bar { width: 140px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; display: inline-block;
  vertical-align: middle; margin-right: 6px; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.spacer { flex: 1; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
:root[data-theme] button.primary, button.primary { color: var(--panel); }
.banner { background: var(--fix-bg); color: var(--fix); padding: 8px 16px; font-size: 14px; }
main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 54px); }
nav { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px; }
nav a { display: grid; grid-template-columns: 12px 64px 1fr; gap: 8px; align-items: start; padding: 7px 12px;
  color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); font-size: 13px; }
nav a:hover { background: var(--chip); }
nav a.active { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
nav .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); margin-top: 4px; }
nav .dot.ok { background: var(--ok); border-color: var(--ok); }
nav .dot.fix { background: var(--fix); border-color: var(--fix); }
nav .nid { font-variant-numeric: tabular-nums; color: var(--muted); }
nav .nq { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
section.detail { padding: 20px 28px 80px; max-width: 1200px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chip.split-test { background: var(--accent); color: var(--panel); }
h2 { font-size: 20px; line-height: 1.4; margin: 4px 0 16px; font-weight: 600; }
.answer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
.answer p { margin: 0 0 10px; }
.answer p:last-child { margin-bottom: 0; }
.ev { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
.ev-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 14px;
  align-items: baseline; font-size: 14px; }
.ev-head b { font-weight: 600; }
.ev-head a { color: var(--accent); }
.ev-head code { font-size: 12px; color: var(--muted); }
.ev-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.ev-body > div { padding: 12px 16px; min-width: 0; }
.ev-body > div + div { border-left: 1px solid var(--line); }
.ev-body img { max-width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: zoom-in; }
.ev-body img.zoom { position: fixed; inset: 3vh 3vw; max-width: 94vw; max-height: 94vh; margin: auto; z-index: 20;
  object-fit: contain; cursor: zoom-out; box-shadow: 0 0 0 100vmax rgba(0,0,0,.6); }
.quote { background: var(--mark); padding: 2px 6px; border-radius: 4px; display: inline; }
pre.chunk { white-space: pre-wrap; word-break: break-word; background: var(--code); border-radius: 6px; padding: 10px 12px;
  font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; max-height: 420px; overflow: auto; margin: 6px 0 0; }
mark { background: var(--mark); color: inherit; padding: 0 1px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
table.abs { border-collapse: collapse; width: 100%; font-size: 14px; }
table.abs td, table.abs th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.abs code { font-size: 13px; }
.decide { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start;
  box-shadow: 0 -6px 16px rgba(0,0,0,.06); }
.choice { display: flex; gap: 8px; }
.choice button { border: 1.5px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 16px;
  cursor: pointer; font-weight: 600; }
.choice button.ok.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.choice button.fix.on { background: var(--fix-bg); border-color: var(--fix); color: var(--fix); }
textarea { width: 100%; min-height: 44px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; background: var(--bg); }
.nav-btns { display: flex; gap: 6px; }
.nav-btns button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.warn { color: var(--fix); }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; }
  nav { position: static; max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
  section.detail { padding: 16px 16px 80px; }
  .ev-body { grid-template-columns: 1fr; }
  .ev-body > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .decide { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Duyệt benchmark nâng cao</h1>
  <label>Split <select id="f-split"><option value="">Tất cả</option><option>dev</option><option>test</option></select></label>
  <label>Nhóm <select id="f-group"><option value="">Tất cả</option></select></label>
  <label>Trạng thái <select id="f-status"><option value="">Tất cả</option><option value="todo">Chưa duyệt</option>
    <option value="ok">OK</option><option value="fix">Sửa</option></select></label>
  <span class="progress"><span class="bar"><i id="bar"></i></span><span id="count"></span></span>
  <span class="spacer"></span>
  <button class="primary" id="save">Lưu file kết quả</button>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <nav id="list"></nav>
  <section class="detail" id="detail"></section>
</main>
<script id="data" type="application/json">/*DATA*/null</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const GROUPS = {table: "Bảng", figure: "Ảnh, sơ đồ", chart: "Biểu đồ", multihop: "Multi-hop", text: "Text",
  unanswerable: "Thiếu evidence"};
const KINDS = {text: "Text", table: "Bảng", figure: "Hình"};
const KEY = "adv-benchmark-review:" + DATA.questions_sha256;
const Q = DATA.questions;
let decisions = Object.assign({}, (DATA.saved && DATA.saved.decisions) || {});
try { Object.assign(decisions, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
let current = 0;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

if (DATA.saved && DATA.saved.questions_sha256 !== DATA.questions_sha256) {
  $("banner").hidden = false;
  $("banner").textContent = "File kết quả đã lưu được duyệt trên một bản questions.json khác. Các quyết định cũ vẫn được nạp; hãy xem lại những câu đã đổi.";
}
for (const g of Object.keys(GROUPS)) $("f-group").insertAdjacentHTML("beforeend", `<option value="${g}">${GROUPS[g]}</option>`);

function status(id) { const d = decisions[id]; return d ? (d.review === "ok" ? "ok" : "fix") : "todo"; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(decisions)); } catch (e) {} }
function visible() {
  const s = $("f-split").value, g = $("f-group").value, st = $("f-status").value;
  return Q.map((q, i) => i).filter((i) => (!s || Q[i].split === s) && (!g || Q[i].group === g) && (!st || status(Q[i].id) === st));
}

function renderList() {
  const idx = visible();
  $("list").innerHTML = idx.map((i) => {
    const q = Q[i], st = status(q.id);
    return `<a href="#${q.id}" data-i="${i}" class="${i === current ? "active" : ""}">
      <span class="dot ${st === "todo" ? "" : st}"></span><span class="nid">${esc(q.id.replace("adv-", ""))}<br>${esc(GROUPS[q.group])}</span>
      <span class="nq">${esc(q.question)}</span></a>`;
  }).join("") || `<p style="padding:12px;color:var(--muted)">Không có câu nào khớp bộ lọc.</p>`;
  const done = Q.filter((q) => status(q.id) !== "todo").length, fix = Q.filter((q) => status(q.id) === "fix").length;
  $("count").textContent = `${done}/${Q.length} đã duyệt · ${fix} cần sửa`;
  $("bar").style.width = (100 * done / Q.length) + "%";
}

function evidenceHTML(e) {
  const quote = e.kind === "figure"
    ? (e.quote ? `<div class="label">Điều cần thấy trong hình</div><div class="quote">${esc(e.quote)}</div>` : "")
    : `<div class="label">Quote phải nằm trong chunk</div><div class="quote">${esc(e.quote)}</div>`;
  const desc = e.description ? `<details><summary>Mô tả tự động của hình (gpt-5.4-mini, chỉ dùng để tìm kiếm)</summary>
      <pre class="chunk">${esc(e.description)}</pre></details>` : "";
  return `<div class="ev">
    <div class="ev-head"><b>${KINDS[e.kind]} · trang ${e.page}</b><span>${esc(e.locator)}</span>
      <a href="${esc(e.pdf)}" target="_blank" rel="noopener">Mở PDF trang ${e.page} ↗</a><code>${esc(e.chunk_id)}</code></div>
    <div class="ev-body">
      <div><div class="label">${esc(e.image_note)}</div><img src="${esc(e.image)}" alt="Evidence trang ${e.page}" loading="lazy"></div>
      <div>${quote}
        <details ${e.kind === "figure" ? "" : "open"}><summary>Chunk đã trích (${esc(e.chunk_locator)})</summary>
          <pre class="chunk">${e.text_html}</pre></details>${desc}</div>
    </div></div>`;
}

function renderDetail() {
  const q = Q[current], d = decisions[q.id] || {};
  let body = "";
  if (q.group === "unanswerable") {
    const rows = (q.absence_check?.results || []).map((r) => `<tr><td><code>/${esc(r.pattern)}/</code></td>
      <td>${r.hits} lần</td><td>${r.pages.length ? r.pages.join(", ") : "—"}</td></tr>`).join("");
    body = `<div class="answer"><div class="label">Hành vi mong đợi</div><p>Tìm rồi từ chối vì không đủ bằng chứng.</p>
      <div class="label">Vì sao tài liệu không có</div><p>${esc(q.absence_reason)}</p>
      <div class="label">Regex đã chạy trên text, bảng và caption của cả 301 trang</div>
      <table class="abs"><tr><th>Regex</th><th>Khớp</th><th>Trang</th></tr>${rows}</table>
      <p class="hint">Regex không xét chữ nằm trong ảnh; nếu nghi ngờ, mở PDF và tìm (Ctrl+F) hoặc xem các hình liên quan.</p></div>`;
  } else {
    body = `<div class="answer"><div class="label">Đáp án mong đợi</div><p>${esc(q.expected_answer)}</p>
      ${q.calculation ? `<div class="label">Phép tính</div><p>${esc(q.calculation)}</p>` : ""}</div>`
      + q.evidence.map(evidenceHTML).join("");
  }
  $("detail").innerHTML = `
    <div class="meta"><span class="chip ${q.split === "test" ? "split-test" : ""}">${q.split}</span>
      <span class="chip">${esc(GROUPS[q.group])}</span>${(q.tags || []).map((t) => `<span class="chip">+${esc(t)}</span>`).join("")}
      <span class="chip">${esc(q.id)}</span></div>
    <h2>${esc(q.question)}</h2>
    ${body}
    <div class="answer"><div class="label">Lý do chọn câu (nhóm, kỹ năng cần)</div><p>${esc(q.reason)}</p></div>
    <div class="decide">
      <div class="choice"><button class="ok ${d.review === "ok" ? "on" : ""}" data-v="ok">OK (1)</button>
        <button class="fix ${d.review === "sửa" ? "on" : ""}" data-v="sửa">Sửa (2)</button></div>
      <div><textarea id="note" placeholder="Ghi chú: sai ở đâu, đáp án đúng là gì…">${esc(d.note || "")}</textarea>
        <div class="hint ${d.review === "sửa" && !d.note ? "warn" : ""}">${d.review === "sửa" && !d.note ? "Ghi rõ cần sửa gì." : "Phím tắt: J/K câu sau/trước, 1 OK, 2 Sửa (khi không gõ trong ô ghi chú)."}</div></div>
      <div class="nav-btns"><button id="prev">← Trước</button><button id="next">Sau →</button></div>
    </div>`;
  document.querySelectorAll(".choice button").forEach((b) => b.onclick = () => decide(b.dataset.v));
  $("note").oninput = (ev) => { const cur = decisions[q.id] || {review: null}; cur.note = ev.target.value; decisions[q.id] = cur;
    if (!cur.review && !cur.note) delete decisions[q.id]; persist(); renderList(); };
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  document.querySelectorAll(".ev-body img").forEach((img) => img.onclick = () => img.classList.toggle("zoom"));
  window.scrollTo({top: 0});
}

function decide(v) {
  const q = Q[current];
  decisions[q.id] = {review: v, note: (decisions[q.id] || {}).note || ""};
  persist(); renderList(); renderDetail();
  if (v === "ok") setTimeout(() => step(1), 150);
}
function step(dir) {
  const idx = visible(), pos = idx.indexOf(current);
  const next = idx[pos === -1 ? 0 : Math.min(idx.length - 1, Math.max(0, pos + dir))];
  if (next !== undefined) go(next);
}
function go(i) { current = i; history.replaceState(null, "", "#" + Q[i].id); renderList(); renderDetail(); }

$("list").onclick = (ev) => { const a = ev.target.closest("a"); if (a) { ev.preventDefault(); go(+a.dataset.i); } };
["f-split", "f-group", "f-status"].forEach((id) => $(id).onchange = () => { renderList(); const idx = visible(); if (idx.length && !idx.includes(current)) go(idx[0]); });
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "j") step(1); else if (ev.key === "k") step(-1);
  else if (ev.key === "1") decide("ok"); else if (ev.key === "2") decide("sửa");
  else if (ev.key === "Escape") document.querySelectorAll("img.zoom").forEach((i) => i.classList.remove("zoom"));
});

$("save").onclick = async () => {
  const out = {questions_sha256: DATA.questions_sha256, saved_at: new Date().toISOString(),
    reviewed: Object.values(decisions).filter((d) => d.review).length, total: Q.length,
    decisions: Object.fromEntries(Q.filter((q) => decisions[q.id]).map((q) => [q.id, decisions[q.id]]))};
  const text = JSON.stringify(out, null, 1) + "\n";
  try {
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({suggestedName: "benchmark_review.json",
        types: [{description: "JSON", accept: {"application/json": [".json"]}}]});
      const w = await handle.createWritable(); await w.write(text); await w.close();
      alert("Đã lưu. Đặt file ở results/advanced/benchmark_review.json trong repo.");
      return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
  a.download = "benchmark_review.json"; a.click();
  alert("Đã tải xuống benchmark_review.json. Chép file vào results/advanced/ trong repo.");
};

const start = Q.findIndex((q) => "#" + q.id === location.hash);
go(start >= 0 ? start : 0);
</script>
</body>
</html>
